{% extends "base.html" %}
{% block title %}Patients — MediCore HMS{% endblock %}
{% block page_title %}Patients{% endblock %}

{% block content %}
<div class="card">
  <div class="card-header">
    <h2>🧑‍⚕️ Patient Records</h2>
    <button class="btn btn-primary" onclick="openModal()">+ Add Patient</button>
  </div>
  <div class="card-body">
    <div class="toolbar">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by name, diagnosis, blood group…" oninput="loadPatients()" />
      </div>
      <select class="filter-select" id="statusFilter" onchange="loadPatients()">
        <option value="">All Status</option>
        <option value="Active">Active</option>
        <option value="Discharged">Discharged</option>
      </select>
      <select class="filter-select" id="genderFilter" onchange="loadPatients()">
        <option value="">All Gender</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Other">Other</option>
      </select>
    </div>

      <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Name</th>
            <th>Age / Gender</th>
            <th>Blood</th>
            <th>Diagnosis</th>
            <th>Phone</th>
            <th>Admitted</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="patientsBody">
          <tr><td colspan="9" style="padding:24px;text-align:center;color:var(--text-muted);">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalTitle">Add Patient</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="patientForm">
        <input type="hidden" id="patientId" />
        <div class="form-grid">
          <div class="form-group full">
            <label>Full Name *</label>
            <input type="text" id="pName" placeholder="e.g. John Doe" required />
          </div>
          <div class="form-group">
            <label>Age *</label>
            <input type="number" id="pAge" placeholder="e.g. 35" min="0" max="150" required />
          </div>
          <div class="form-group">
            <label>Gender *</label>
            <select id="pGender" required>
              <option value="">Select gender</option>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
          <div class="form-group">
            <label>Phone</label>
            <input type="text" id="pPhone" placeholder="555-0100" />
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="pEmail" placeholder="patient@email.com" />
          </div>
          <div class="form-group">
            <label>Blood Group</label>
            <select id="pBlood">
              <option value="">Select</option>
              <option>A+</option><option>A-</option>
              <option>B+</option><option>B-</option>
              <option>AB+</option><option>AB-</option>
              <option>O+</option><option>O-</option>
            </select>
          </div>
