{% extends "base.html" %}
{% block title %}Appointments — MediCore HMS{% endblock %}
{% block page_title %}Appointments{% endblock %}

{% block content %}

<div class="card">
  <div class="card-header">
    <h2>📅 Appointment Records</h2>
    <button class="btn btn-primary" onclick="openModal()">+ Book Appointment</button>
  </div>
  <div class="card-body">
    <div class="toolbainder">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search by patient, doctor, reason…" oninput="loadAppointments()" />
      </div>
      <select class="filter-select" id="statusFilter" onchange="loadAppointments()">
        <option value="">All Status</option>
        <option value="Scheduled">Scheduled</option>
        <option value="Completed">Completed</option>
        <option value="Cancelled">Cancelled</option>
      </select>
    </div>
    <div class="table-wrapper">

            <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Patient</th>
            <th>Doctor</th>
            <th>Specialization</th>
            <th>Date</th>
            <th>Time</th>
            <th>Reason</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="appointmentsBody">
          <tr><td colspan="9" style="padding:24px;text-align:center;color:var(--text-muted);">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
let deleteId = null;

function statusBadge(status) {
  const map = { 'Scheduled': 'info', 'Completed': 'success', 'Cancelled': 'danger' };
  return `<span class="badge badge-${map[status] || 'secondary'}">${status}</span>`;
}
  
async function loadAppointments() {
  const search = document.getElementById('searchInput').value;
  const status = document.getElementById('statusFilter').value;
  const params = new URLSearchParams({ search, status });
  try {
    const appts = await apiFetch(`/api/appointments?${params}`);
    const tbody = document.getElementById('appointmentsBody');
    if (!appts.length) {
      tbody.innerHTML = `<tr><td colspan="9"><div class="empty-state"><div class="empty-icon">📅</div><p>No appointments found</p></div></td></tr>`;
      return;
    }
    tbody.innerHTML = appts.map(a => `

          <tr>
        <td style="color:var(--text-muted);font-size:12px;">#${a.id}</td>
        <td><strong>${a.patient_name}</strong></td>
        <td>${a.doctor_name}</td>
        <td><span class="badge badge-info">${a.specialization}</span></td>
        <td>${a.appointment_date}</td>
        <td>${a.appointment_time}</td>
        <td>${a.reason || '—'}</td>
        <td>${statusBadge(a.status)}</td>
        <td>
          <div class="td-actions">
            <button class="btn-icon edit" onclick="editAppointment(${a.id})" title="Edit">✏️</button>
            <button class="btn-icon delete" onclick="askDelete(${a.id})" title="Delete">🗑️</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (e) {
    showToast('Failed to load appointments', 'error');
  }
}
