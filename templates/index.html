<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Hospital Management System{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <h2>
      <span class="brand-icon">🏥</span>
      MediCore HMS
    </h2>
    <p>Hospital Management</p>
  </div>


  
  <nav class="sidebar-nav">
    <div class="nav-section-label">Main</div>
    <a href="/dashboard" class="{% if request.path == '/dashboard' %}active{% endif %}">
      <span class="nav-icon">📊</span> Dashboard
    </a>

    
    <div class="nav-section-label">Records</div>
    <a href="/patients" class="{% if request.path == '/patients' %}active{% endif %}">
      <span class="nav-icon">🧑‍⚕️</span> Patients
    </a>
    <a href="/doctors" class="{% if request.path == '/doctors' %}active{% endif %}">
      <span class="nav-icon">👨‍⚕️</span> Doctors
    </a>


        <a href="/appointments" class="{% if request.path == '/appointments' %}active{% endif %}">
      <span class="nav-icon">📅</span> Appointments
    </a>
  </nav>

  
  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">{{ session.username[0].upper() }}</div>
      <div class="user-details">
        <div class="name">{{ session.username }}</div>
        <div class="role">{{ session.role|capitalize }}</div>
      </div>
    </div>


        <a href="/logout" class="btn-logout">
      <span>🚪</span> Sign Out
    </a>
  </div>
</aside>
